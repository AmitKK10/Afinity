<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Blue Ribbon Gradient (Left Leg) -->
    <linearGradient id="blueRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="35%" stopColor="#0ea5e9" />
      <stop offset="70%" stopColor="#2563eb" />
      <stop offset="100%" stopColor="#1d4ed8" />
    </linearGradient>

    <!-- Teal/Emerald Ribbon Gradient (Right Leg) -->
    <linearGradient id="tealRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#34d399" />
      <stop offset="40%" stopColor="#10b981" />
      <stop offset="80%" stopColor="#059669" />
      <stop offset="100%" stopColor="#047857" />
    </linearGradient>

    <!-- Golden Growth Arrow Gradient -->
    <linearGradient id="goldRibbon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#d97706" />
      <stop offset="40%" stopColor="#f59e0b" />
      <stop offset="80%" stopColor="#fbbf24" />
      <stop offset="100%" stopColor="#fef08a" />
    </linearGradient>

    <!-- Chart Column Mint Gradient -->
    <linearGradient id="chartBarGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stopColor="#059669" />
      <stop offset="50%" stopColor="#10b981" />
      <stop offset="100%" stopColor="#34d399" />
    </linearGradient>

    <!-- Wordmark 'A' Cyan Gradient -->
    <linearGradient id="letterAGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#2563eb" />
    </linearGradient>

    <filter id="ribbonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- The 3D Emblem 'A' Geometry (Surrounding Background Removed for Transparency) -->
  <g transform="translate(6, -10)" filter="url(#ribbonShadow)">
    <!-- 3 Rising Teal Chart Columns (Behind Arrow & Arch) -->
    <!-- Column 1 (Left/Smallest) -->
    <rect x="256" y="224" width="18" height="34" rx="4" fill="url(#chartBarGrad)" />
    <!-- Column 2 (Middle) -->
    <rect x="282" y="196" width="18" height="62" rx="4" fill="url(#chartBarGrad)" />
    <!-- Column 3 (Right/Tallest) -->
    <rect x="308" y="164" width="18" height="94" rx="4" fill="url(#chartBarGrad)" />

    <!-- Right Emerald Ribbon Fold / Leg -->
    <path
      d="M256 76
         L314 186
         L382 308
         C389 320 398 328 412 328
         L434 328
         C448 328 454 316 446 304
         L280 76
         C272 64 264 64 256 76 Z"
      fill="url(#tealRibbon)"
    />

    <!-- Left Cyan/Electric Blue Ribbon Fold / Leg -->
    <path
      d="M256 76
         L120 304
         C112 316 118 328 132 328
         L168 328
         C182 328 192 320 198 308
         L256 196
         L276 156
         L256 76 Z"
      fill="url(#blueRibbon)"
    />

    <!-- Upward Golden Growth Swoosh Ribbon with Arrow Head -->
    <path
      d="M136 302
         C184 286 242 284 312 248
         C354 226 392 188 412 152
         L416 194
         L428 144
         L378 148
         L412 152
         C392 188 354 226 312 248
         C242 284 184 286 136 302 Z"
      fill="url(#goldRibbon)"
    />
  </g>

  <!-- Wordmark "Afinity" -->
  <g transform="translate(0, 396)">
    <!-- Cyan Stylized A -->
    <path
      d="M128 48
         L154 -12
         C158 -22 170 -22 174 -12
         L200 48
         L180 48
         L172 26
         L156 26
         C154 32 148 40 142 48
         L128 48 Z
         M164 6
         L169 -7
         L174 6
         Z"
      fill="url(#letterAGrad)"
    />
    <!-- 'finity' in clean bold white font -->
    <text
      x="196"
      y="48"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="62"
      font-weight="800"
      letter-spacing="-1"
      fill="#ffffff"
    >finity</text>
  </g>

  <!-- Divider line & dot -->
  <line x1="168" y1="462" x2="332" y2="462" stroke="#10b981" stroke-width="2" stroke-opacity="0.4" />
  <circle cx="250" cy="462" r="3.5" fill="#34d399" />

  <!-- Subtitle Tagline: TRACK • ANALYZE • GROW -->
  <text
    x="250"
    y="488"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="14"
    font-weight="700"
    letter-spacing="5"
    fill="#94a3b8"
    text-anchor="middle"
  >TRACK  •  ANALYZE  •  GROW</text>
</svg>
