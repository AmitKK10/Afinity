<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Afinity — Financial Command Center</title>
    <meta name="description" content="Afinity: Premium personal financial management and net-worth tracking PWA." />
    
    <!-- PWA & Mobile Web App settings -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0f1d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Afinity" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <meta property="og:title" content="Afinity — Financial Command Center" />
    <meta property="og:description" content="Track • Analyze • Grow — Personal Financial Command Center" />
    <meta property="og:type" content="website" />
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('afinity_theme');
          if (savedTheme === 'light' || savedTheme === 'light_contrast') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light', 'theme-light');
            document.documentElement.setAttribute('data-theme', 'light');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#f1f5f9');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#080c16] text-slate-100 antialiased selection:bg-cyan-500/30 selection:text-cyan-200 overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
